name: Social posts

on:
  schedule:
    - cron: "23 * * * *"   # hourly; GitHub may delay scheduled runs by several minutes
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [posts, profile, discover, follow, instagram-check]
        default: posts
      dry_run:
        description: "Dry run (validate and list the queue, post nothing)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: social-posts
  cancel-in-progress: false

jobs:
  bluesky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update profile
        if: inputs.task == 'profile'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        working-directory: .github/social
        run: python3 profile.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Find candidate accounts
        if: inputs.task == 'discover'
        working-directory: .github/social
        run: python3 accounts.py discover

      - name: Follow accounts
        if: inputs.task == 'follow'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        working-directory: .github/social
        run: python3 accounts.py follow ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Check Instagram connection
        if: inputs.task == 'instagram-check'
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        working-directory: .github/social
        run: python3 instagram.py check

      - name: Publish due posts
        if: (inputs.task || 'posts') == 'posts'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 .github/social/post.py --dry-run
          else
            python3 .github/social/post.py
          fi

      - name: Record what was posted
        run: |
          if ! git diff --quiet -- .github/social/posted.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/social/posted.json
            git commit -m "social: log published post"
            git push
          fi
